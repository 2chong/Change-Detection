<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>건물 변화탐지</title>
</head>
<body>
    <h1>GeoJSON 기반 건물 변화탐지</h1>

    <form action="/detect_from_image" method="post" enctype="multipart/form-data">
        <label for="geotiff_file">GeoTIFF 파일:</label><br>
        <input type="file" name="geotiff_file" required><br><br>

        <label for="past_geojson_file">과거 GeoJSON 파일:</label><br>
        <input type="file" name="past_geojson_file" required><br><br>

        <label for="resolution">해상도 (m/pixel):</label><br>
        <input type="number" step="0.1" name="resolution" value="20.0"><br><br>

        <label for="cut_threshold">절단 임계값:</label><br>
        <input type="number" step="0.01" name="cut_threshold" value="0.05"><br><br>

        <label for="cd_threshold">변화 임계값:</label><br>
        <input type="number" step="0.01" name="cd_threshold" value="0.7"><br><br>

        <button type="submit">변화탐지 시작</button>
    </form>

    {% if result %}
        <hr>
        <h2>결과</h2>
        <p><strong>해상도:</strong> {{ result.resolution }} m/pixel</p>
        <p><strong>절단 임계값:</strong> {{ result.cut_threshold }}</p>
        <p><strong>변화 임계값:</strong> {{ result.cd_threshold }}</p>
        <p><strong>마스크 이미지:</strong><br>
            <img src="{{ result.mask_image }}" alt="Mask Preview" width="400">
        </p>
        <p><a href="{{ result.dmap }}">DMap GeoJSON 다운로드</a></p>
        <p><a href="{{ result.seg }}">Seg GeoJSON 다운로드</a></p>
    {% endif %}
</body>
</html>
